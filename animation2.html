<!DOCTYPE html>
<html>
    <head>
        <title>animation</title>

        <style>
            .move{
                display: flex;
                gap: 20px;
                margin-top: 100px;
            }
            .box{
                width: 100px;
                height: 100px;
                border-radius: 10px;
            }
            .box1{
                background-color: red;
                animation: moveright 2s ease-in infinite alternate;
            }
            @keyframes moveright{
                from{transform: translateX(0);}
                to{transform: translateX(100px);}
            }
            .box2{
                background-color: navy;
                animation: scalebox 1.5s ease-in infinite alternate;
            }
            @keyframes scalebox{
                from{transform: scale(0)}
                to{transform: scale(1.1);}
            }
            .box3{
                background-color: aqua;
                animation: spin 2s ease-in infinite alternate;
            }
            @keyframes spin{
                from{transform: rotate(0);}
                to{transform: rotate(340deg);}
            }
            .box4{
                background-color: blueviolet;
                animation: colorchange 2s ease-in infinite alternate;
            }
            @keyframes colorchange{
                0%{background-color: blueviolet;}
                40%{background-color: chocolate;}
                50%{background-color: wheat;}
                60%{background-color: teal;}
                100%{background-color: cornflowerblue;}
            }
            .box5{
                background-color: steelblue;
                animation: bounce 2s ease-in infinite alternate;
            }
            @keyframes bounce{
                0%,100%{transform: translateY(0);}
                50%{transform: translateY(-70px);}
            }
            .box6{
                background-color: slateblue;
                animation: fadein ease-in infinite alternate ;
            }
            @keyframes fadein{
                from{opacity: 1;}
                to{opacity: 1.2;}
            }


        </style>
    </head>
    <body>
        <div class="move">
            <div class="box box1"></div>
            <div class="box box2"></div>
             <div class="box box3"></div>
              <div class="box box4"></div>
               <div class="box box5"></div>
               <div class="box box6"></div>
               

        </div>
    </body>
</html>
