<!DOCTYPE html>
<html>
    <head> 
        <title>selectors</title>
        <style>
            .first{ color: cornflowerblue;}
            .sec{color: goldenrod;}
            .third{color: navy;
            background-color: azure;}
            div p{
                color: brown;
            }
            div > p{
                color: chartreuse;
            }
        </style>

    </head>
    <body>
        <h1 class="first">
            heloooo
        </h1>
        <h1 class="sec">haiiiii</h1>
        <h3 class="third">welcome</h3>
        <!-- descendant -->
        <div>
            <p>helloooooo</p>
            <p>haiiiiii</p>
        </div>
        <!-- child selector -->
         <div>
            <p>heloooooo</p>
            <section> <p>haiiiiiii</p></section>
         </div>

    </body>
</html>
