<!DOCTYPE html>
<html>

<head>
    <title>image gallery</title>
    <style>
        .main {
            width: 100%;
            height: 500px;
            background-color: aliceblue;
            display: flex;


        }

        .sub {
            width: 31%;
            height: 290px;
            margin: 24px;
            border-radius: 20px;
            box-shadow: 2px 3px 2px;
            background-color: antiquewhite;

        }

        img {
            /* object-fit: contain; */
            width: 470px;
            height: 200px;
            border-radius: 20px 20px 0px 0px;
        }
    </style>



</head>

<body>

    <div class="main">

                src="https://static.vecteezy.com/system/resources/previews/075/214/748/non_2x/a-basket-with-pink-roses-sitting-on-top-of-a-wooden-table-photo.jpg"
                alt=""> <br>
            a delicate pink rose in full bloom,symbolizing grace, admiration,and sweetness.
        </div>
        <div class="sub">
            <img 
                src="https://thumbs.dreamstime.com/b/beautiful-amazing-cosmos-flower-field-landscape-sunset-nature-wallpaper-background-179698760.jpg"
                alt=""> <br>
            the photo highlights the beauty and freshness of the flower.
        </div>
        <div class="sub">
            <img 
                src="https://media.istockphoto.com/id/1394440950/photo/natural-view-cosmos-filed-and-sunset-on-garden-background.jpg?s=612x612&w=0&k=20&c=eBnRobwsk2w_9MqM6bnXukIia5j-ayuMS0PeB6GHN0E="
