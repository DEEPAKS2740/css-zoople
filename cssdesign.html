<!DOCTYPE html>
<html>
    <head>
        <title>css design</title>
        <style>
            .out{
                width: 100%;
                height: 600px;
                background: linear-gradient(violet,rgb(36, 36, 220));
            padding-top: 20%;
            padding-left: 20%;

            }
            .in{
                width: 60%;
                height: 400px;
                background-color: white;
               text-align: center;
               border-radius: 20px ;
            }
            img{
                border-radius: 24px;
            border: 5px solid violet;
            }
            .box{
                width: 80%;
                height: 70px;
                background-color: rgb(189, 187, 187); 
                border-left: 12px solid violet;
                margin-left: 40px;
            }
            
        </style>
    </head>
    <body>
        <div class="out">
            <div class="in">
            <h1>WELCOME TO CSS DESIGN</h1>
            <hr>
            <p>This is a simple example showing <span style="color: blueviolet;">text styling</span>,fonts,background,div,and images properties using CSS.</p>
            <img width="300" height="150" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQwrv6wL3j0nnG6xaohw79S9j1QQAeO67V5XBhlcaqUWA&s=10" alt="">
            <div class="box">
                <p>this is a <span>styled div</span>(card).it uses background color,padding,and a border highlight.</p>

            </div>

</div>
        </div>
    </body>
</html>
