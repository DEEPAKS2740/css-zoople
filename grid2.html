<!DOCTYPE html>
<html>
    <head>
        <title>grid2</title>
        <style>
            .layout{

                display: grid;
                grid-template-rows: repeat(3,170px);
                grid-template-areas: "header header header"
                                       "sidebar content art"
                                       "footer footer footer" ;
                                       grid-gap: 20px;
            }

            .header{
                grid-area: header;
                background-color: rgb(25, 188, 188);
                color: burlywood;

            }
            .siderbar{
                grid-area: sidebar;
                background-color:blueviolet;
                color: azure;
            }
            .content{
                grid-area: content;
                background-color: rgb(127, 127, 252);
                color: brown;
            }
            .art{
                grid-area: art;
                background-color: rgb(241, 144, 74);
                color: cornflowerblue;
            }
            .footer{
                grid-area: footer;
                background-color: darksalmon;
                color: cornsilk;
            }

        </style>
    </head>
    <body>
        <div class="layout">
            <div class="header">header</div>
            <div class="siderbar">sidebar</div>
            <div class="content">content</div>
            <div class="art">article</div>
            <div class="footer">footer</div>

        </div>

    </body>
</html>
