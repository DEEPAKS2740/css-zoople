<!DOCTYPE html>
<html>
    <head>
        <title>animation</title>
        <style>
           .move{
            animation: move 4s ease-in 4;
            margin-top: 600px;
           }


           .road{
            width: 100%;
            height: 100px;
            background: linear-gradient(black,gray);
           }

           @keyframes move{
            0%{
                transform: translateX(0%);
            }
            100%{
                transform: translateX(100);
            }
           }

        </style>


    </head>
    <body>
        <div class="move">
            <img width="150px" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTjxj4uU69Q1SAsInvNpg4FIWlIs68S1Uz3gXFQEDxOj5nv3QUGeZMYqgOt&s=10" alt="">

        </div>
        <div class="road"></div>
    </body>
</html>
