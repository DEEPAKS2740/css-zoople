<!DOCTYPE html>
<html>
    <head><title>flex</title>
<style>
    .main{
        width: 100%;
        height: 400px;
        background-color: beige;
        color: aliceblue;
        display: flex;
        flex-direction: row-reverse;
        gap: 23px;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
    }
    .sub{
        width: 30%;
        height: 100px;
        background-color: navy;
        margin: 12px;
    }
</style>


    </head>
    <body>
        <div class="main">
            <div class="sub">1</div>
            <div class="sub">2</div>
            <div class="sub">3</div>
            <div class="sub">4</div>
            <div class="sub">5</div>
        </div>

    </body>
</html>
